plugins { id 'com.android.application' }

android {
    namespace 'com.investigationdesk.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.investigationdesk.player'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
