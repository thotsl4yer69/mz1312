name: One-shot Akari JSX lint fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-akari-caption.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix JSX caption text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          old = '>{label} // REAL CAPTURE</figcaption>'
          new = ">{label} {'// REAL CAPTURE'}</figcaption>"
          if old not in s:
              raise SystemExit('caption anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          git config user.name "MAZLABZ portfolio bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: escape Akari screenshot caption text"
          git push
