name: One-shot evidence ledger integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-evidence-ledger.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Integrate evidence ledger
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()

          import_anchor = "import { useMemo, useState } from 'react';\n"
          if "import EvidenceLedger" not in s:
              if import_anchor not in s:
                  raise SystemExit('React import anchor not found')
              s = s.replace(import_anchor, import_anchor + "import EvidenceLedger from './EvidenceLedger';\n", 1)

          section_anchor = '''      </section>

      <section id="lab"'''
          replacement = '''      </section>

      <EvidenceLedger />

      <section id="lab"'''
          if '<EvidenceLedger />' not in s:
              if section_anchor not in s:
                  raise SystemExit('Lab section anchor not found')
              s = s.replace(section_anchor, replacement, 1)

          p.write_text(s)
          PY

      - name: Verify integration
        run: |
          grep -q "import EvidenceLedger" src/app/page.tsx
          grep -q "<EvidenceLedger />" src/app/page.tsx

      - name: Commit project-file changes
        run: |
          git config user.name "MAZLABZ portfolio bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: surface flagship evidence ledger"
          git push
