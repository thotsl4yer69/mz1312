name: Prepare portfolio static bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static portfolio
        run: npm run build

      - name: Verify static export
        run: |
          test -f out/index.html
          test -d out/_next
          echo "Static portfolio bundle verified."

      - name: Upload deployable site bundle
        uses: actions/upload-artifact@v4
        with:
          name: mazlabz-portfolio-static
          path: out/
          if-no-files-found: error
          retention-days: 14
