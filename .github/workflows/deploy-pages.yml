name: Deploy MAZLABZ portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SITE_URL: https://mazlabz.us.kg
  NEXT_PUBLIC_BASE_PATH: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static portfolio
        run: npm run build

      - name: Verify production site surface
        run: |
          test -f out/index.html
          test -d out/_next
          test -f out/start/index.html
          test -f out/capabilities/index.html
          test -f out/work/sentient-core/index.html
          test -f out/work/drifter/index.html
          test -f out/work/myceliyum/index.html
          test -f out/work/benchforge/index.html
          test -f out/work/hexplayer/index.html
          test -f out/work/akari/index.html
          test -f out/404.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/icon.svg
          grep -q 'START A BUILD' out/index.html
          grep -q 'PROJECT BRIEF' out/start/index.html
          grep -q 'CAPABILITIES / PROOF MAP' out/index.html
          grep -q 'SYSTEMS INTEGRATION' out/capabilities/index.html
          grep -q 'https://mazlabz.us.kg/' out/index.html
          grep -q 'https://mazlabz.us.kg/capabilities/' out/sitemap.xml
          grep -q 'https://mazlabz.us.kg/sitemap.xml' out/robots.txt
          ! grep -q '"/mz1312/_next/' out/index.html
          echo "MAZLABZ production routes and custom-domain asset paths verified."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
