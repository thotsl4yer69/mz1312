name: Deploy Jack Mazzini personal site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://jackmazzini.com
  NEXT_PUBLIC_BASE_PATH: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static portfolio
        run: npm run build

      - name: Verify personal site surface
        run: |
          test -f out/index.html
          test -d out/_next
          test -f out/start/index.html
          test -f out/capabilities/index.html
          test -f out/ghost/index.html
          test -f out/404.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/icon.svg
          test -f out/CNAME
          grep -q 'Jack Mazzini' out/index.html
          grep -q 'SELECTED WORK' out/index.html
          grep -q 'https://jackmazzini.com/' out/index.html
          grep -q 'https://jackmazzini.com/capabilities/' out/sitemap.xml
          grep -q 'https://jackmazzini.com/sitemap.xml' out/robots.txt
          ! grep -q 'NULLVECTOR LABS' out/index.html
          echo "Production personal site build verified."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
