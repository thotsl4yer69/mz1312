name: One-shot capability navigation integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-capabilities.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link capability proof map
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()

          old = '''          <a href="#work">WORK</a>
          <a href="#lab">LAB</a>'''
          new = '''          <a href="#work">WORK</a>
          <a href="./capabilities/">PROOF MAP</a>
          <a href="#lab">LAB</a>'''
          if old not in s:
              raise SystemExit('nav anchor not found')
          s = s.replace(old, new, 1)

          old = '''<div className="footer-links"><a href="#top">TOP ↑</a><a href="./start/">START A BUILD →</a><a href="https://github.com/thotsl4yer69" target="_blank" rel="noreferrer">GITHUB ↗</a></div>'''
          new = '''<div className="footer-links"><a href="#top">TOP ↑</a><a href="./capabilities/">PROOF MAP</a><a href="./start/">START A BUILD →</a><a href="https://github.com/thotsl4yer69" target="_blank" rel="noreferrer">GITHUB ↗</a></div>'''
          if old not in s:
              raise SystemExit('footer anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify links
        run: |
          grep -q 'href="./capabilities/">PROOF MAP' src/app/page.tsx

      - name: Commit navigation integration
        run: |
          git config user.name "MAZLABZ portfolio bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: surface capability proof map in navigation"
          git push
