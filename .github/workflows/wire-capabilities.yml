name: One-shot capability navigation integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-capabilities.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link capability proof map
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()

          nav_anchor = '<a href="#work">WORK</a>'
          if './capabilities/">PROOF MAP' not in s:
              if nav_anchor not in s:
                  raise SystemExit('nav anchor not found')
              s = s.replace(nav_anchor, nav_anchor + '\n          <a href="./capabilities/">PROOF MAP</a>', 1)

          footer_anchor = '<a href="#top">TOP ↑</a>'
          footer_link = '<a href="./capabilities/">PROOF MAP</a>'
          footer_start = s.index('<div className="footer-links">')
          footer_end = s.index('</div>', footer_start)
          footer = s[footer_start:footer_end]
          if footer_link not in footer:
              if footer_anchor not in footer:
                  raise SystemExit('footer anchor not found')
              footer = footer.replace(footer_anchor, footer_anchor + footer_link, 1)
              s = s[:footer_start] + footer + s[footer_end:]

          p.write_text(s)
          PY

      - name: Verify links
        run: |
          test "$(grep -o 'href="./capabilities/">PROOF MAP' src/app/page.tsx | wc -l)" -ge 2

      - name: Commit navigation integration
        run: |
          git config user.name "MAZLABZ portfolio bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: surface capability proof map in navigation"
          git push
