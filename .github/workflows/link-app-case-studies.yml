name: One-shot app case-study link integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-app-case-studies.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link application case studies
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          s = s.replace("    repo: 'https://github.com/thotsl4yer69/Myceliyum',\n    accent: 'moss',", "    repo: 'https://github.com/thotsl4yer69/Myceliyum',\n    caseStudy: './work/myceliyum/',\n    accent: 'moss',", 1)
          s = s.replace("    repo: 'https://github.com/thotsl4yer69/akari-android',\n    accent: 'yellow',", "    repo: 'https://github.com/thotsl4yer69/akari-android',\n    caseStudy: './work/akari/',\n    accent: 'yellow',", 1)
          p.write_text(s)
          PY
      - name: Verify links
        run: |
          grep -q "caseStudy: './work/myceliyum/'" src/app/page.tsx
          grep -q "caseStudy: './work/akari/'" src/app/page.tsx
      - name: Commit page integration
        run: |
          git config user.name "MAZLABZ portfolio bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: link Android engineering case studies"
          git push
