name: One-shot accessibility polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accessibility-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve flagship tabs and motion handling
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/page.tsx')
          s = page.read_text()
          old = '''              role="tab"
              aria-selected={activeId === project.id}
            >'''
          new = '''              role="tab"
              id={`project-tab-${project.id}`}
              aria-controls={`project-panel-${project.id}`}
              aria-selected={activeId === project.id}
            >'''
          if old not in s:
              raise SystemExit('tab anchor not found')
          s = s.replace(old, new, 1)

          old = '''        <article className={`feature-project accent-${active.accent}`}>
'''
          new = '''        <article
          className={`feature-project accent-${active.accent}`}
          role="tabpanel"
          id={`project-panel-${active.id}`}
          aria-labelledby={`project-tab-${active.id}`}
          aria-live="polite"
        >
'''
          if old not in s:
              raise SystemExit('tabpanel anchor not found')
          s = s.replace(old, new, 1)
          page.write_text(s)

          css = Path('src/app/globals.css')
          c = css.read_text()
          addition = '''

/* Accessibility: keyboard focus and reduced motion */
:where(a, button, input, textarea, select):focus-visible {
  outline: 2px solid var(--acid);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .signal-track { transform: none !important; }
  .hero-console-wrap { transform: none; }
}
'''
          if 'Accessibility: keyboard focus and reduced motion' not in c:
              css.write_text(c.rstrip() + addition + '\n')
          PY

      - name: Verify accessibility patch
        run: |
          grep -q 'aria-controls={`project-panel-${project.id}`}' src/app/page.tsx
          grep -q 'role="tabpanel"' src/app/page.tsx
          grep -q 'prefers-reduced-motion' src/app/globals.css
          grep -q 'focus-visible' src/app/globals.css

      - name: Commit accessibility polish
        run: |
          git config user.name "MAZLABZ portfolio bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx src/app/globals.css
          git commit -m "feat: improve keyboard and reduced-motion accessibility"
          git push
