name: Portfolio site CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: portfolio-site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://jackmazzini.com
  NEXT_PUBLIC_BASE_PATH: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify personal site
        run: |
          test -f out/index.html
          test -f out/capabilities/index.html
          grep -q 'Jack Mazzini' out/index.html
          grep -q 'SELECTED WORK' out/index.html
          grep -q 'https://jackmazzini.com/' out/index.html
          grep -q 'https://jackmazzini.com/sitemap.xml' out/robots.txt
          ! grep -q 'NULLVECTOR LABS' out/index.html
          echo "Jack Mazzini personal portfolio build verified."
