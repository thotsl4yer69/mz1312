name: Portfolio site CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: portfolio-site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://thotsl4yer69.github.io/mz1312
  NEXT_PUBLIC_BASE_PATH: /mz1312

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify Pages origin
        run: |
          test -f out/index.html
          test -f out/capabilities/index.html
          grep -q 'TOOLCHAIN LEDGER' out/capabilities/index.html
          grep -q 'Blender' out/capabilities/index.html
          grep -q 'LaserGRBL' out/capabilities/index.html
          grep -q 'SatDump' out/capabilities/index.html
          grep -q 'https://thotsl4yer69.github.io/mz1312/' out/index.html
          grep -q 'https://thotsl4yer69.github.io/mz1312/sitemap.xml' out/robots.txt
          grep -q '/mz1312/_next/' out/index.html
          echo "GitHub Pages project build and expanded toolchain verified."
