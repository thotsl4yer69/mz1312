name: Portfolio site CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: portfolio-site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:

  NEXT_PUBLIC_BASE_PATH: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6


      - name: Resolve canonical URL from configured domain
        run: echo "NEXT_PUBLIC_SITE_URL=https://$(cat public/CNAME)" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify studio site
        run: |
          test -f out/index.html
          test -f out/capabilities/index.html
          grep -q 'MAZLABZ' out/index.html
          grep -q 'SELECTED WORK' out/index.html
          grep -Fq "https://$(cat public/CNAME)/" out/index.html
          grep -Fq "https://$(cat public/CNAME)/sitemap.xml" out/robots.txt
          ! grep -q 'NULLVECTOR LABS' out/index.html
          echo "MAZLABZ studio portfolio build verified."
