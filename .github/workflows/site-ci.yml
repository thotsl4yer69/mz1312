name: Portfolio site CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: portfolio-site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://mazlabz.us.kg
  NEXT_PUBLIC_BASE_PATH: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify production origin
        run: |
          test -f out/index.html
          grep -q 'https://mazlabz.us.kg/' out/index.html
          grep -q 'https://mazlabz.us.kg/sitemap.xml' out/robots.txt
          ! grep -q '"/mz1312/_next/' out/index.html
          echo "Custom-domain production build verified."
