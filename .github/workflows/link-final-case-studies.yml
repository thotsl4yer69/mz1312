name: One-shot final case-study link integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-final-case-studies.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link BenchForge and HexPlayer case studies
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          s = s.replace("    stack: ['TypeScript', 'Web Serial', 'AI tooling', 'Electronics', 'Firmware', 'Validation'],\n    accent: 'violet',", "    stack: ['TypeScript', 'Web Serial', 'AI tooling', 'Electronics', 'Firmware', 'Validation'],\n    caseStudy: './work/benchforge/',\n    accent: 'violet',", 1)
          s = s.replace("    repo: 'https://github.com/thotsl4yer69/Hexplayer',\n    accent: 'pink',", "    repo: 'https://github.com/thotsl4yer69/Hexplayer',\n    caseStudy: './work/hexplayer/',\n    accent: 'pink',", 1)
          p.write_text(s)
          PY

      - name: Verify links
        run: |
          grep -q "caseStudy: './work/benchforge/'" src/app/page.tsx
          grep -q "caseStudy: './work/hexplayer/'" src/app/page.tsx

      - name: Commit page integration
        run: |
          git config user.name "MAZLABZ portfolio bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: link final flagship case studies"
          git push
