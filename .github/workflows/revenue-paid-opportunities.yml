name: Paid buyer opportunities - every 10 minutes

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/revenue-paid-opportunities.yml'
      - 'revenue_bot/find_paid_work.py'

permissions:
  contents: write

concurrency:
  group: revenue-buyer-opportunity-scan
  cancel-in-progress: false

jobs:
  source-real-paid-work:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: true

      - name: Search current open paid technical requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 revenue_bot/find_paid_work.py

      - name: Save only genuinely new leads
        run: |
          git config user.name "Revenue opportunity bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revenue_bot/leads.json revenue_bot/opportunities.md
          if git diff --cached --quiet; then
            echo "No new opportunities to commit."
          else
            git commit -m "Refresh qualified paid-work leads"
            git push origin HEAD:main
          fi
