name: One-shot ghost shell lint fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ghost-shell.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fix ghost shell lint findings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/ghost/GhostTerminalClient.tsx')
          text = path.read_text()

          replacements = {
              "import { FormEvent, useEffect, useMemo, useRef, useState } from 'react';": "import { FormEvent, useEffect, useRef, useState } from 'react';",
              "  const uptime = useMemo(() => Math.max(1, Math.floor((Date.now() - bootedAt) / 1000)), [bootedAt, entries]);": "  const uptime = Math.max(1, Math.floor((Date.now() - bootedAt) / 1000));",
              '              <p className="text-[#ffc15a]">// MEMORY MAP</p>': '              <p className="text-[#ffc15a]">{\'// MEMORY MAP\'}</p>',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit fix
        run: |
          git config user.name "MAZLABZ portfolio bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/ghost/GhostTerminalClient.tsx
          git commit -m "fix: clean ghost shell lint findings"
          git push
